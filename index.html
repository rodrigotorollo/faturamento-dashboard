        else if(canais[canal]){ sum += canais[canal]; }

      return sum;

      if(canal === 'Todos'){ sum += info.vals[p]; }

  // soma janela de N dias terminando no índice refIdx (empresa: colunas 1-7; total: 8; ml/sh/tt: 9/10/11)
  function somaJanela(col, refIdx, n){
    let s = 0, usados = 0;
    for(let i = refIdx; i >= 0 && usados < n; i--, usados++) s += daily30[i][col] || 0;
    return {v: s, dias: usados};

  function getValRef(emp, canal, p, refIdx){
    // p: 0=Ontem(1d) 1=7d 2=15d 3=30d 4=Mês(até o dia, dentro do mês)
    const janelas = [1,7,15,30];
    function soma(col){
      if(p === 4){
        const mesRef = daily30[refIdx][0].split('/')[1];
        let s = 0;
        for(let i = refIdx; i >= 0 && daily30[i][0].split('/')[1] === mesRef; i--) s += daily30[i][col] || 0;
        return s;
      }
      return somaJanela(col, refIdx, janelas[p]).v;
    }
    if(canal !== 'Todos' && emp === 'Todas') return soma(colCh[canal]);
    if(emp === 'Todas') return soma(8);
    // empresa específica: coluna dela é só ML (semântica da planilha)
    if(canal === 'Todos' || canal === 'Mercado Livre') return soma(colDe[emp]);

  }

          backgroundColor:T.tooltipBg, borderColor:T.tooltipBg, borderWidth:1, padding:10,
          titleColor:T.tooltipText, bodyColor:T.tooltipText,
          titleFont:{family:"'JetBrains Mono', monospace", size:12}, bodyFont:{family:"'JetBrains Mono', monospace", size:12},
          callbacks:{ label: c => ' R$ ' + fmt(c.parsed.y) } } },
        scales:{
          x:{ grid:{ color:T.chartGrid }, border:{ display:false }, ticks:{color:T.muted} },
          y:{ grid:{ color:T.chartGrid }, border:{ display:false }, ticks:{ callback: v => 'R$ ' + (v/1000).toFixed(0)+'k', color:T.muted } }
        }
      }
    });
  }catch(err){ console.error('trend chart', err); }

  $('#chartToggle').addEventListener('click', (e) => {
    if(e.target.tagName !== 'BUTTON' || !chart) return;
    $$('#chartToggle button').forEach(b=>b.setAttribute('style', S.toggleBtn(false)));
    e.target.setAttribute('style', S.toggleBtn(true));
    const mode = e.target.dataset.mode;
    chart.config.type = (mode === 'empilhado') ? 'bar' : 'line';
    chart.data = mode === 'total' ? totalDataset() : (mode === 'empresa' ? companyDatasets() : stackedDatasets());
    chart.options.plugins.legend.display = (mode !== 'total');
    chart.options.scales.x.stacked = (mode === 'empilhado');
    chart.options.scales.y.stacked = (mode === 'empilhado');
    chart.update();
  });

  // ---------- comparative table ----------
  const tbody = $('#tableBody');
  const allCompanies = ['SID','LH','HENNA','SH','ZHAO','EVER','LT'];
  months.forEach((m,i) => {
    const groupId = 'mes-' + i;
    const tr = document.createElement('tr');
    if(i===CLOSED) tr.style.cssText = S.rowCurrentBg;
    tr.style.cursor = 'pointer';
    const delta = i>0 ? ((totals[i]-totals[i-1])/totals[i-1]*100) : null;
    const isPartial = i === PARTIAL;
    let open = false;
    tr.innerHTML = `<td style="${S.td};${S.tdFirst}"><span style="${S.chev(false)}" class="chev">▸</span> ${m}${i===CLOSED?`<span style="${S.tag()}">fechado</span>`:''}${isPartial?`<span style="${S.tag(T.accent)}">em andamento</span>`:''}</td>
      ${allCompanies.map(c => `<td style="${S.td}">${fmt(data[c][i])}</td>`).join('')}
      <td style="${S.td};font-weight:700;">${fmt(totals[i])}</td>
      <td style="${S.td};color:${delta!==null&&delta>=0?T.positive:T.negative};">${delta!==null && !isPartial ? fmtPct(delta) : '—'}</td>`;
    tr.addEventListener('click', () => {
      open = !open;
      tr.querySelector('.chev').setAttribute('style', S.chev(open));
      $$('.' + groupId).forEach(r => r.style.display = open ? 'table-row' : 'none');
    });
    tbody.appendChild(tr);

    const mc = monthlyChannels[i];
    [['Mercado Livre', mc.ml], ['Shopee', mc.sh], ['TikTok Shop', mc.tt]].forEach(([chName, v]) => {
      if(v <= 0) return;
      const cr = document.createElement('tr');
      cr.className = groupId; cr.style.display = 'none';
      cr.innerHTML = `<td style="${S.td};text-align:left;padding-left:26px;">${channelBadge(chName)}</td>
        <td colspan="7" style="${S.td};text-align:left;color:${T.faint};font-family:'Inter',sans-serif;font-size:11px;">${(v/totals[i]*100).toFixed(1)}% do mês</td>
        <td style="${S.td}">${fmt(v)}</td><td style="${S.td}"></td>`;
      tbody.appendChild(cr);
    });
  });
}

window.__dashboardMount = mount;

</script>

function switchTab(tab){

}
