<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Faturamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box;}
  :root{color-scheme:dark;}
  body{ margin:0; background:#0A0C10; }
  ::selection{ background:rgba(62,207,142,.28); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#232937; border-radius:8px; border:2px solid #0A0C10; }
  ::-webkit-scrollbar-thumb:hover{ background:#2E3542; }

  @keyframes pulseDot{ 0%{ box-shadow:0 0 0 0 rgba(62,207,142,.45);} 70%{ box-shadow:0 0 0 7px rgba(62,207,142,0);} 100%{ box-shadow:0 0 0 0 rgba(62,207,142,0);} }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
  @keyframes shimmer{ from{ transform:translateX(-100%);} to{ transform:translateX(100%);} }

  /* entrada escalonada dos painéis */
  #app > div > div > *{ animation:fadeUp .55s cubic-bezier(.16,1,.3,1) backwards; }
  #app > div > div > *:nth-child(1){ animation-delay:.02s; }
  #app > div > div > *:nth-child(2){ animation-delay:.07s; }
  #app > div > div > *:nth-child(3){ animation-delay:.12s; }
  #app > div > div > *:nth-child(4){ animation-delay:.17s; }
  #app > div > div > *:nth-child(5){ animation-delay:.22s; }
  #app > div > div > *:nth-child(6){ animation-delay:.27s; }
  #app > div > div > *:nth-child(7){ animation-delay:.32s; }
  #app > div > div > *:nth-child(8){ animation-delay:.37s; }
  #app > div > div > *:nth-child(9){ animation-delay:.42s; }
  #app > div > div > *:nth-child(10){ animation-delay:.47s; }
  #app > div > div > *:nth-child(11){ animation-delay:.52s; }
  #app > div > div > *:nth-child(12){ animation-delay:.57s; }

  #app button, #tabBar button{ transition:background .2s ease, color .2s ease, box-shadow .2s ease, transform .12s ease; }
  #app button:active, #tabBar button:active{ transform:scale(.96); }
  #app select{ transition:border-color .2s ease; }
  #app select:hover{ border-color:#2E3542 !important; }
  .fmenu > div{ transition:background .15s ease; }
  .fmenu > div:hover{ background:rgba(255,255,255,.045); }
  #app th.sortable{ cursor:pointer; user-select:none; transition:color .2s ease; }
  #app th.sortable:hover{ color:#E9ECF2 !important; }
  #app tbody tr{ transition:background .15s ease; }
  #app tbody tr:hover{ background:rgba(255,255,255,.022); }
  #cardGrid > div, #recordStrip > div{ transition:transform .25s cubic-bezier(.16,1,.3,1), border-color .25s ease; }
  #cardGrid > div:hover, #recordStrip > div:hover{ transform:translateY(-3px); }
  #paceFill{ position:relative; overflow:hidden; }
  #paceFill::after{ content:''; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent); animation:shimmer 2.8s ease-in-out infinite; }

  @media (max-width:900px){
    #app div[style*="repeat(4,1fr)"]{ grid-template-columns:repeat(2,1fr) !important; }
    #app div[style*="1fr 1.2fr"]{ grid-template-columns:1fr !important; }
  }
  @media (max-width:560px){
    #fValue{ font-size:30px !important; }
  }
</style>
</head>
<body>

<!-- ===== ABA: VISÃO CLÁSSICA (réplica da planilha) ===== -->
<div style="max-width:1224px;margin:20px auto 14px;padding:0 22px;">
  <div id="tabBar" style="display:inline-flex;gap:2px;padding:4px;background:#12151C;border:1px solid #232937;border-radius:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);">
    <button id="tabPainel" onclick="switchTab('painel')" style="font-family:'Geist','Outfit',sans-serif;font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;background:transparent;color:#8B94A7;">Painel novo</button>
    <button id="tabClassica" onclick="switchTab('classica')" style="font-family:'Geist','Outfit',sans-serif;font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;background:transparent;color:#8B94A7;">Planilha (modo clássico)</button>
  </div>
</div>


<div id="app"></div>

    const pct = (cur/prev - 1) * 100;
    return `<span style="${S.badge(pct>=0)}">${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1).replace('.',',')}%</span>` +
      `<span style="font-size:11px;color:${T.faint};">${rot} · R$ ${fmt(prev)}</span>`;
  }
  const rotJanelaAnterior = ['vs o dia anterior','vs os 7 dias anteriores','vs os 15 dias anteriores','vs os 30 dias anteriores','vs os mesmos dias do mês anterior'];
  function renderCompare(p, endIdx){
    const el = $('#fCompare');
    const cols = colsFor(empList(), canList());
    if(!cols){ el.innerHTML = ''; return; }
    let cur, prev;
    if(p === 4){ cur = mesAte60(cols, endIdx); prev = prevMesMesmosDias(cols, endIdx); }
    else { const n = [1,7,15,30][p]; cur = somaJanela60(cols, endIdx, n); prev = somaJanela60(cols, endIdx - n, n); }
    el.innerHTML = cmpBadgeHtml(cur, prev, rotJanelaAnterior[p]);
  }

  function renderFilter(){
    const mes = fMes.value;
    const refSel = $('#fDia') ? $('#fDia').value : 'hoje';
    if(refSel !== 'hoje'){ return renderFilterRef(parseInt(refSel)); }
    const modoMes = mes !== 'recente';
    $('#fPeriodo').style.opacity = modoMes ? '0.35' : '1';
    $('#fPeriodo').style.pointerEvents = modoMes ? 'none' : 'auto';
    const emps = empList(), canais = canList();

    function valorDe(es, cs){
      if(modoMes) return getValMesKey(mes, es, cs);
      let s = 0;
      es.forEach(e => recentByCompany[e].children.forEach(ch => { if(cs.includes(ch.name)) s += ch.vals[fP]; }));
      return s;
    }

    const total = valorDe(emps, canais);
    $('#fValue').textContent = 'R$ ' + fmt(total);
    $('#fLabel').textContent = rotuloEmpresas() + ' · ' + rotuloCanais() + ' · ' + (modoMes ? mes : recentPeriods[fP]);

    if(modoMes){
      const mesesDet = Object.keys(monthlyDetail);
      const idxMes = mesesDet.indexOf(mes);
      const mesAnt = idxMes >= 0 ? mesesDet[idxMes+1] : null;
      $('#fCompare').innerHTML = mesAnt ? cmpBadgeHtml(total, getValMesKey(mesAnt, emps, canais), 'vs ' + mesAnt) : '';
    } else {
      renderCompare(fP, daily60.length - 1);
    }

    const meterEl = $('#meter'), legendEl = $('#meterLegend');
    meterEl.innerHTML = ''; legendEl.innerHTML = '';
    let parts;
    if(emps.length > 1){
      $('#meterTitle').textContent = 'Composição por empresa';
      parts = emps.map(name => [name, valorDe([name], canais), colors[name] || T.faint]);
    } else {
      $('#meterTitle').textContent = 'Composição por marketplace';
      parts = canais.map(cn => [cn, valorDe(emps, [cn]), channelColors[cn]]);
    }
    const sumParts = parts.reduce((s,p)=>s+p[1],0) || 1;
    parts.forEach(([name, v, col]) => {
      if(v <= 0) return;
      const pct = v/sumParts*100;
      const seg = document.createElement('div');
      seg.style.cssText = `width:${pct}%;background:${col};height:100%;`;
      seg.title = `${name}: ${pct.toFixed(1)}%`;
      meterEl.appendChild(seg);
      const item = document.createElement('div');
      item.style.cssText = S.meterLegendItem;
      item.innerHTML = `<span style="${S.sw};background:${col}"></span>${name} <b style="font-family:'JetBrains Mono',monospace;color:${T.text};">${pct.toFixed(1)}%</b>`;
      legendEl.appendChild(item);
    });
  }

    $('#paceFill').style.width = pctMes + '%';
    $('#paceFillPct').textContent = pctMes.toFixed(0) + '%';
    $('#paceProj').textContent = 'R$ ' + fmt(proj);

    $('#paceYoY').textContent = 'R$ ' + fmt(ANO_PASSADO_PARCIAL);
    $('#paceYoYBadge').innerHTML = `<span style="${S.badge(yoy>=0)}">${yoy>=0?'▲':'▼'} ${Math.abs(yoy).toFixed(1).replace('.',',')}% este ano</span>`;
  })();

  // ---------- mesmo mês ao longo dos anos ----------
  (function(){
    const sel = $('#ymSel'), grid = $('#ymGrid'), note = $('#ymNote');
    const mesesDisp = Object.keys(sameMonthYears).map(Number).sort((a,b)=>a-b);
    sel.innerHTML = mesesDisp.map(m => `<option value="${m}">${mesesNomes[m-1]}</option>`).join('');
    const mesFechado = PARCIAL_YM[1] > 1 ? PARCIAL_YM[1] - 1 : 12;
    sel.value = String(sameMonthYears[mesFechado] ? mesFechado : mesesDisp[0]);

    function render(){
      const m = Number(sel.value);
      const porAno = sameMonthYears[m] || {};
      const anos = Object.keys(porAno).map(Number).sort((a,b)=>a-b);
      const max = Math.max(...anos.map(a => porAno[a]));
      grid.innerHTML = '';
      anos.forEach((ano, i) => {
        const v = porAno[ano];
        const isParcial = (ano === PARCIAL_YM[0] && m === PARCIAL_YM[1]);
        const isInicioBase = (ano === 2024 && m === 7);
        const anoAntIncompleto = (ano - 1 === 2024 && m === 7);
        const atual = i === anos.length - 1;
        let badge = '';
        if(isParcial && porAno[ano-1] !== undefined && ANO_PASSADO_PARCIAL > 0){
          const pct = (v / ANO_PASSADO_PARCIAL - 1) * 100;
          badge = `<span style="${S.badge(pct>=0)}">${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1).replace('.',',')}%</span>
            <div style="${S.paceNote}">vs mesmos ${DIAS_DECORRIDOS} dias de ${String(ano-1).slice(2)}</div>`;
        } else if(i > 0 && !anoAntIncompleto){
          const pct = (v / porAno[anos[i-1]] - 1) * 100;
          badge = `<span style="${S.badge(pct>=0)}">${pct>=0?'▲':'▼'} ${Math.abs(pct).toFixed(1).replace('.',',')}%</span>
            <div style="${S.paceNote}">vs ${mesesNomes[m-1].slice(0,3)}/${String(anos[i-1]).slice(2)}</div>`;

      ${allCompanies.map(c => `<td style="${S.td}">${fmt(data[c][i])}</td>`).join('')}
      <td style="${S.td};font-weight:700;">${fmt(totals[i])}</td>
      <td style="${S.td};color:${delta!==null&&delta>=0?T.positive:T.negative};">${delta!==null && !isPartial ? fmtPct(delta) : '—'}</td>`;
    tr.addEventListener('click', () => {
      open = !open;
      tr.querySelector('.chev').setAttribute('style', S.chev(open));
      $$('.' + groupId).forEach(r => r.style.display = open ? 'table-row' : 'none');
    });
    tbody.appendChild(tr);

    const mc = monthlyChannels[i];
    [['Mercado Livre', mc.ml], ['Shopee', mc.sh], ['TikTok Shop', mc.tt]].forEach(([chName, v]) => {
      if(v <= 0) return;
      const cr = document.createElement('tr');
      cr.className = groupId; cr.style.display = 'none';
      cr.innerHTML = `<td style="${S.td};text-align:left;padding-left:26px;">${channelBadge(chName)}</td>
        <td colspan="7" style="${S.td};text-align:left;color:${T.faint};font-family:'Geist','Outfit',sans-serif;font-size:11px;">${(v/totals[i]*100).toFixed(1)}% do mês</td>
        <td style="${S.td}">${fmt(v)}</td><td style="${S.td}"></td>`;
      tbody.appendChild(cr);
    });
  });
}

window.__dashboardMount = mount;

</script>

<script>
function switchTab(tab){
  const painel = document.getElementById('app');
  const classic = document.getElementById('classicView');
  const bP = document.getElementById('tabPainel');
  const bC = document.getElementById('tabClassica');
  const on  = "font-family:'Geist','Outfit',sans-serif;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;background:#3ECF8E14;color:#3ECF8E;box-shadow:inset 0 0 0 1px #3ECF8E59;";
  const off = "font-family:'Geist','Outfit',sans-serif;font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:9px;border:none;cursor:pointer;background:transparent;color:#8B94A7;box-shadow:none;";
  if(tab === 'painel'){ painel.style.display=''; classic.style.display='none'; bP.style.cssText=on; bC.style.cssText=off; }
  else{ painel.style.display='none'; classic.style.display='block'; bP.style.cssText=off; bC.style.cssText=on; }
}
switchTab('painel');
</script>
